name: Audit

# Checks the site's build dependencies for known vulnerabilities every week, so a new advisory shows
# up as a failed run. The published site is static; these packages only run when building or serving
# it locally. Not a required check: a new advisory does not block unrelated pull requests.
on:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths: [ .github/workflows/audit.yml ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Dependencies, moderate or worse
        run: npm audit --audit-level=moderate
