name: Audit

# Checks the site's build dependencies for known vulnerabilities every week, so a new advisory shows
# up as a failed run. The published site is static; these packages only run when building or serving
# it locally. Also runs on every pull request, so one that adds or updates a vulnerable dependency
# shows it before merging. Not a required check: an advisory published for an unchanged dependency
# would otherwise block unrelated pull requests until it is fixed.
on:
  schedule:
    - cron: "29 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Dependencies, moderate or worse
        run: npm audit --audit-level=moderate
